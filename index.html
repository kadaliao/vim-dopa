<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="用真实 Vim 按键闯关的小游戏：按对一步，音乐多一层，画面更热闹。">
<meta name="theme-color" content="#160f2b">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Vim 多巴闯关</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: one centered column of screens over a full-bleed party canvas; the editor is the stage. */
:root {
  color-scheme: dark;
  --ink: #160f2b; --panel: #221944; --panel2: #2c2156; --editor: #0e0a1f; --line: #3d3170;
  --fg: #f4effe; --muted: #a99fd0; --dim: #6f64a0;
  --pink: #ff5fa2; --sun: #ffd447; --mint: #46e6c3; --sky: #6aa8ff; --grape: #b07cff; --orange: #ff9b5f;
  --on-accent: #1a1030;
  --f-display: "ZCOOL KuaiLe", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-body: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --mode: var(--pink);
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: radial-gradient(1200px 700px at 50% -10%, #2a1d57 0%, var(--ink) 60%) fixed, var(--ink); color: var(--fg); font: 15px/1.6 var(--f-body); overflow-x: hidden; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
#app { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 40px; }
.screen { display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .node:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
kbd, .k { font-family: var(--f-mono); font-weight: 600; font-size: 13px; padding: 1px 7px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); border-bottom-width: 3px; color: var(--fg); white-space: nowrap; }
.btn { border: 0; border-radius: 12px; padding: 11px 18px; font-weight: 700; background: var(--panel2); box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); transition: transform .08s; }
.btn:hover { background: #372a6b; }
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn.primary { background: var(--pink); color: var(--on-accent); }
.btn.primary:hover { background: #ff7bb4; }
.btn.small { padding: 6px 12px; font-size: 13px; border-radius: 9px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.muted { color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; }

/* ---------------- title */
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 28px; align-items: center; padding-top: 18px; }
.logo { font-family: var(--f-mono); font-weight: 800; font-size: clamp(64px, 12vw, 120px); line-height: .9; letter-spacing: -4px; }
.logo .v { color: var(--pink); }
.logo .cursor { display: inline-block; width: .55em; height: .9em; background: var(--sun); vertical-align: -0.08em; margin-left: 6px; animation: blink 1s steps(1) infinite; }
.subtitle { font-family: var(--f-display); font-size: clamp(30px, 5vw, 46px); line-height: 1.1; margin-top: 8px; }
.tagline { max-width: 34em; color: var(--muted); margin: 12px 0 0; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.cta .btn.primary { font-size: 17px; padding: 13px 22px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 20px; font-size: 13px; color: var(--muted); }
.stats b { color: var(--fg); font-family: var(--f-mono); font-size: 16px; margin-right: 4px; font-variant-numeric: tabular-nums; }
.demo { position: relative; }
.demo .editor { font-size: 17px; min-height: 140px; }
.demo-cap { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; min-height: 30px; }
.demo-cap .trail { min-height: 0; }
.demo .mascot { position: absolute; right: -6px; top: -54px; width: 78px; }
.settings { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 8px; font-size: 13px; }
.settings .sp { flex: 1; }

/* ---------------- map */
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.bar h2 { font-family: var(--f-display); font-size: 30px; font-weight: 400; }
.bar .sp { flex: 1; }
.tree { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 34px 28px; padding: 8px 0 20px; }
.tree svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.node { position: relative; text-align: left; border: 2px solid var(--line); background: var(--panel); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.node.solo { grid-column: 1 / span 2; justify-self: center; width: min(100%, calc(50% - 14px)); }
.node:hover:not(.locked) { border-color: var(--pink); }
.node .num { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.node .nm { font-family: var(--f-display); font-size: 22px; line-height: 1.15; }
.node .ks { display: flex; flex-wrap: wrap; gap: 4px; }
.node .ks .k { font-size: 11px; padding: 0 5px; }
.node .meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); gap: 8px; }
.node .meter { height: 5px; border-radius: 3px; background: var(--editor); overflow: hidden; }
.node .meter i { display: block; height: 100%; background: var(--sun); }
.node.locked { opacity: .5; cursor: not-allowed; border-style: dashed; }
.node.done { border-color: var(--mint); }
.node.next { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(255,95,162,.18); }
.node .badge { position: absolute; top: -10px; right: 12px; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--pink); color: var(--on-accent); }
.node.done .badge { background: var(--mint); }

/* ---------------- play */
.hud { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.hud .where { font-family: var(--f-display); font-size: 22px; line-height: 1.1; }
.hud .where small { display: block; font-family: var(--f-mono); font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.dots { display: flex; gap: 5px; }
.dots i { width: 12px; height: 12px; border-radius: 4px; background: var(--panel2); border: 1px solid var(--line); }
.dots i.now { background: var(--pink); border-color: var(--pink); animation: pulse 1s infinite; }
.dots i.s1 { background: var(--orange); } .dots i.s2 { background: var(--sky); } .dots i.s3 { background: var(--sun); } .dots i.s0 { background: var(--dim); }
.hud .sp { flex: 1; }
.dopa { text-align: right; line-height: 1; }
.dopa .lbl { font-size: 11px; color: var(--muted); letter-spacing: .1em; }
.dopa .val { font-family: var(--f-mono); font-weight: 800; font-size: 26px; color: var(--sun); font-variant-numeric: tabular-nums; display: inline-block; }
.dopa .val.bump { animation: bump .4s; }
.hype { display: flex; gap: 3px; margin-top: 5px; justify-content: flex-end; }
.hype i { width: 14px; height: 6px; border-radius: 2px; background: var(--panel2); }
.hype i.on { background: var(--pink); }
.hype i.on:nth-child(n+3) { background: var(--orange); } .hype i.on:nth-child(n+5) { background: var(--sun); }
.combo { font-family: var(--f-mono); font-weight: 800; color: var(--mint); font-size: 14px; min-width: 64px; text-align: center; }
.combo.big { animation: bump .4s; }

.playgrid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.task { position: relative; background: var(--panel); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.task .pt { font-family: var(--f-display); font-size: 26px; line-height: 1.15; }
.task .goal { font-size: 13px; color: var(--muted); }
.task .goal b { color: var(--sun); font-weight: 600; }
.task .ks { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.hintbox { border-top: 1px dashed var(--line); padding-top: 8px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
.hintbox .seq { display: flex; flex-wrap: wrap; gap: 4px; }

.edwrap { position: relative; }
.editor { font-family: var(--f-mono); font-size: 19px; line-height: 1.65; background: var(--editor); border: 2px solid var(--line); border-radius: 14px; padding: 12px 0; overflow-x: auto; white-space: pre; transition: border-color .2s, box-shadow .2s; }
.editor.on { border-color: var(--mode); box-shadow: 0 0 0 4px color-mix(in srgb, var(--mode) 18%, transparent); }
.ln { display: flex; min-height: 1.65em; padding-right: 16px; }
.ln .no { width: 3.2em; flex: none; text-align: right; padding-right: 1em; color: var(--dim); user-select: none; font-size: .8em; line-height: 2.06; }
.ln.cur-ln { background: rgba(255,255,255,.035); }
.ln.cur-ln .no { color: var(--muted); }
.ln.df .no { color: var(--orange); }
.ln.vl .tx { background: rgba(176,124,255,.32); }
.ln .tx { min-width: 0; }
.cn { background: var(--mode); color: var(--on-accent); border-radius: 2px; animation: curblink 1.1s steps(1) infinite; }
.ci { box-shadow: inset 3px 0 0 var(--mode); }
.cc { outline: 1px solid var(--dim); }
.tg { position: relative; color: var(--sun); background: rgba(255,212,71,.16); border-radius: 3px; box-shadow: 0 0 0 2px var(--sun); animation: target 1.2s ease-in-out infinite; }
.cn.tg { color: var(--on-accent); }
.sel { background: rgba(176,124,255,.4); }
.statusline { display: flex; gap: 10px; align-items: center; font-family: var(--f-mono); font-size: 13px; background: var(--panel); border-radius: 10px; padding: 6px 8px; margin-top: 8px; min-height: 36px; }
.modepill { font-weight: 800; letter-spacing: .06em; padding: 2px 10px; border-radius: 6px; background: var(--mode); color: var(--on-accent); font-size: 12px; }
.statusline .msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.statusline .msg.cmdl { color: var(--fg); }
.statusline .msg.cmdl::after { content: ""; display: inline-block; width: .55em; height: 1.1em; vertical-align: -0.2em; background: var(--fg); margin-left: 1px; animation: blink 1s steps(1) infinite; }
.statusline .msg.good { color: var(--mint); }
.statusline .cnt { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.statusline .cnt b { color: var(--fg); }
.statusline .cnt b.over { color: var(--orange); }
.statusline .pend { color: var(--sun); min-width: 2ch; }
.trail { display: flex; gap: 4px; flex-wrap: wrap; min-height: 30px; margin-top: 10px; align-items: center; }
.trail .k { animation: pop .25s cubic-bezier(.2,1.6,.4,1); }
.trail .k.esc { background: var(--pink); color: var(--on-accent); border-color: var(--pink); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.actions .sp { flex: 1; }
.actions .hintbtn.glow { background: var(--sun); color: var(--on-accent); animation: pulse 1.2s infinite; }

.side { display: flex; flex-direction: column; gap: 12px; }
.goalcard { background: var(--panel); border-radius: 16px; padding: 12px; position: relative; }
.goalcard h3 { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--muted); margin-bottom: 8px; }
.goalcard .editor { font-size: 14px; padding: 8px 0; border-width: 1px; }
.goalcard .ln .no { width: 2.4em; }
.goalcard .ln.ok .tx { color: var(--mint); }
.goalcard .where { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.goalcard .where b { color: var(--sun); }
.mascot-spot { display: flex; justify-content: center; padding-top: 6px; }
.mascot-spot .mascot { width: 120px; }

.solve { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.solve .card { background: rgba(14,10,31,.94); border: 2px solid var(--sun); border-radius: 18px; padding: 14px 22px; text-align: center; animation: zoom .45s cubic-bezier(.2,1.5,.4,1); max-width: 90%; }
.solve .jd { font-family: var(--f-display); font-size: 40px; line-height: 1.1; }
.solve .jd.beat { background: linear-gradient(90deg, var(--pink), var(--sun), var(--mint), var(--sky)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.solve .st { font-size: 26px; letter-spacing: 4px; color: var(--sun); }
.solve .st .off { color: var(--dim); }
.solve .tip { font-size: 13px; color: var(--muted); margin-top: 4px; white-space: normal; }
.solve .plus { font-family: var(--f-mono); font-weight: 800; color: var(--mint); }

.mobilebar { display: none; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.mobilebar .btn { flex: 1; font-family: var(--f-mono); }
@media (pointer: coarse) { .mobilebar { display: flex; } }
#kbd { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }

/* ---------------- mascot */
.mascot { display: block; transform-origin: 50% 92%; }
.mascot .body { fill: var(--mode); transition: fill .25s; }
.mascot .eyes { transform-origin: 50% 42%; animation: eyeblink 4s infinite; }
.mascot .sweat { opacity: 0; transition: opacity .3s; }
.mascot.worried .sweat { opacity: 1; }
.mascot.bop { animation: bop .22s ease-out; }
.mascot.jump { animation: jump .75s cubic-bezier(.3,1.4,.5,1); }
.mascot.spin { animation: spin .9s cubic-bezier(.3,1.2,.5,1); }

/* ---------------- result / overlay */
.resultcard { background: var(--panel); border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.resultcard .big { font-family: var(--f-display); font-size: clamp(34px, 6vw, 52px); line-height: 1.05; }
.resultcard .nums { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.resultcard .nums div { display: flex; flex-direction: column; }
.resultcard .nums b { font-family: var(--f-mono); font-size: 26px; color: var(--sun); font-variant-numeric: tabular-nums; }
.resultcard .nums span { font-size: 12px; color: var(--muted); }
.rlist { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 6px 14px; font-size: 14px; align-items: center; }
.rlist .s { color: var(--sun); letter-spacing: 2px; }
.rlist .s .off { color: var(--dim); }
.rlist .kk { font-family: var(--f-mono); color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.rlist .kk.beat { color: var(--mint); }
.unlock { border: 2px dashed var(--mint); border-radius: 14px; padding: 10px 14px; color: var(--mint); }
#overlay { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(10,6,24,.72); backdrop-filter: blur(4px); padding: 16px; }
#overlay .card { width: min(520px, 100%); background: var(--panel); border: 2px solid var(--line); border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px; animation: zoom .35s cubic-bezier(.2,1.4,.4,1); }
#overlay .num { font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; color: var(--muted); }
#overlay h2 { font-family: var(--f-display); font-size: 40px; font-weight: 400; line-height: 1.1; }
#overlay .ks { display: flex; gap: 6px; flex-wrap: wrap; }
#overlay .foot { font-size: 12px; color: var(--muted); }
#toasts { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 9; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(92vw, 520px); }
.toast { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font-size: 14px; animation: drop .3s ease-out; text-align: center; }
.toast.ms { background: var(--sun); color: var(--on-accent); font-family: var(--f-display); font-size: 24px; border: 0; }
.floaty { position: fixed; z-index: 6; pointer-events: none; font-family: var(--f-mono); font-weight: 800; color: var(--mint); font-size: 22px; animation: rise 1.1s ease-out forwards; }
.shake { animation: shake .35s; }

@keyframes blink { 50% { opacity: 0; } }
@keyframes curblink { 50% { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 2px var(--mode); } }
@keyframes target { 50% { box-shadow: 0 0 0 4px rgba(255,212,71,.35), 0 0 18px rgba(255,212,71,.5); } }
@keyframes pulse { 50% { transform: scale(1.12); } }
@keyframes pop { from { transform: scale(.3) translateY(8px); opacity: 0; } }
@keyframes bump { 40% { transform: scale(1.35); } }
@keyframes zoom { from { transform: scale(.6); opacity: 0; } }
@keyframes drop { from { transform: translateY(-14px); opacity: 0; } }
@keyframes rise { to { transform: translateY(-70px); opacity: 0; } }
@keyframes bop { 40% { transform: scale(1.08, .9); } }
@keyframes jump { 30% { transform: translateY(-46px) rotate(-8deg) scale(.95, 1.08); } 60% { transform: translateY(0) scale(1.12, .88); } }
@keyframes spin { 50% { transform: translateY(-36px) rotate(200deg); } 100% { transform: rotate(360deg); } }
@keyframes eyeblink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
@keyframes shake { 20% { transform: translate(-6px, 2px); } 40% { transform: translate(5px, -3px); } 60% { transform: translate(-4px, 1px); } 80% { transform: translate(3px, 2px); } }

@media (max-width: 860px) {
  .playgrid { grid-template-columns: minmax(0, 1fr); }
  .side { flex-direction: row; align-items: stretch; }
  .side .goalcard { flex: 1; min-width: 0; }
  .mascot-spot { padding-top: 0; align-items: center; }
  .mascot-spot .mascot { width: 76px; }
}
@media (max-width: 720px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .demo .mascot { width: 60px; top: -44px; }
  .editor { font-size: 16px; }
  .tree { gap: 26px 12px; }
  .node .nm { font-size: 18px; }
  .rlist { grid-template-columns: auto minmax(0, 1fr) auto; }
  .rlist .kk { grid-column: 3; }
  .rlist .s { grid-column: 3; }
}
@media (prefers-reduced-motion: reduce) {
  .cn, .tg, .logo .cursor, .mascot .eyes { animation: none; }
}
body.calm .mascot, body.calm .shake, body.calm .dopa .val, body.calm .solve .card, body.calm .trail .k { animation: none !important; }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<template id="tpl-mascot">
  <svg class="mascot" viewBox="0 0 100 104" aria-hidden="true">
    <ellipse cx="50" cy="99" rx="28" ry="4" fill="rgba(0,0,0,.35)"/>
    <rect x="27" y="84" width="14" height="12" rx="5" fill="#1a1030"/>
    <rect x="59" y="84" width="14" height="12" rx="5" fill="#1a1030"/>
    <path d="M17 52 Q6 46 9 34" stroke="#1a1030" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M83 52 Q94 46 91 34" stroke="#1a1030" stroke-width="5" fill="none" stroke-linecap="round"/>
    <rect class="body" x="16" y="12" width="68" height="76" rx="16" stroke="#1a1030" stroke-width="4"/>
    <rect x="24" y="18" width="20" height="7" rx="3.5" fill="rgba(255,255,255,.45)"/>
    <g class="eyes">
      <ellipse cx="38" cy="45" rx="9" ry="10" fill="#fff" stroke="#1a1030" stroke-width="3"/>
      <ellipse cx="62" cy="45" rx="9" ry="10" fill="#fff" stroke="#1a1030" stroke-width="3"/>
      <circle cx="40" cy="47" r="4.5" fill="#1a1030"/>
      <circle cx="64" cy="47" r="4.5" fill="#1a1030"/>
    </g>
    <ellipse cx="28" cy="60" rx="5" ry="3" fill="rgba(255,255,255,.4)"/>
    <ellipse cx="72" cy="60" rx="5" ry="3" fill="rgba(255,255,255,.4)"/>
    <path d="M42 62 Q50 71 58 62" stroke="#1a1030" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path class="sweat" d="M86 20 q6 10 0 14 q-6 -4 0 -14z" fill="#6aa8ff" stroke="#1a1030" stroke-width="2"/>
  </svg>
</template>

<div id="app">
  <section id="s-title" class="screen">
    <div class="hero">
      <div>
        <div class="logo"><span class="v">V</span>im<span class="cursor"></span></div>
        <div class="subtitle">多巴闯关</div>
        <p class="tagline">每一关都是一个小编辑任务，用真正的 Vim 按键完成。按对一步，音乐多一层，画面更热闹。没有 Game Over，卡住了随时看提示。</p>
        <div class="cta">
          <button class="btn primary" id="b-continue">开始闯关</button>
          <button class="btn" id="b-map">关卡地图</button>
          <button class="btn" id="b-mix">混合挑战</button>
        </div>
        <div class="stats" id="stats"></div>
      </div>
      <div class="demo">
        <div class="mascot-host"></div>
        <div class="editor" id="demo-ed"></div>
        <div class="demo-cap"><div class="trail" id="demo-trail"></div><span class="muted" id="demo-label"></span></div>
      </div>
    </div>
    <div class="settings">
      <button class="btn small" id="b-sound"></button>
      <button class="btn small" id="b-motion"></button>
      <span class="sp"></span>
      <span class="muted">需要实体键盘和英文输入法 · 记录只存在这个浏览器里</span>
      <button class="btn small" id="b-reset">清除记录</button>
    </div>
  </section>

  <section id="s-map" class="screen" hidden>
    <div class="bar">
      <button class="btn small" id="b-map-back">← 返回</button>
      <h2>关卡地图</h2>
      <span class="sp"></span>
      <span class="muted" id="map-sum"></span>
    </div>
    <div class="tree" id="tree"></div>
  </section>

  <section id="s-play" class="screen" hidden>
    <div class="hud">
      <button class="btn small" id="b-quit" title="离开这一轮">← 地图</button>
      <div class="where" id="hud-where"></div>
      <div class="dots" id="hud-dots"></div>
      <span class="sp"></span>
      <div class="combo" id="hud-combo"></div>
      <div class="dopa"><div class="lbl">多巴值</div><span class="val" id="hud-dopa">1</span><div class="hype" id="hud-hype"></div></div>
      <button class="btn small" id="b-mute" title="声音"></button>
    </div>
    <div class="playgrid">
      <div class="main">
        <div class="task">
          <div class="pt" id="p-title"></div>
          <div class="goal" id="p-goal"></div>
          <div class="ks" id="p-keys"></div>
          <div class="hintbox" id="p-hint" hidden></div>
          <div class="solve" id="solve" hidden></div>
        </div>
        <div class="edwrap" style="margin-top:12px">
          <div class="editor on" id="ed"></div>
        </div>
        <div class="statusline" id="status"></div>
        <div class="trail" id="trail"></div>
        <div class="mobilebar" id="mobilebar">
          <button class="btn" data-k="<Esc>">Esc</button>
          <button class="btn" data-k="<BS>">⌫</button>
          <button class="btn" data-k="<CR>">↵</button>
          <button class="btn" data-k="<C-r>">^R</button>
          <button class="btn" data-k="kbd">键盘</button>
        </div>
        <div class="actions">
          <button class="btn small" id="b-retry">重来 <kbd>Alt+R</kbd></button>
          <button class="btn small hintbtn" id="b-hint">提示 <kbd>Alt+H</kbd></button>
          <span class="sp"></span>
          <button class="btn small" id="b-skip">跳过这关</button>
        </div>
      </div>
      <aside class="side">
        <div class="goalcard" id="goalcard"></div>
        <div class="mascot-spot mascot-host"></div>
      </aside>
    </div>
  </section>

  <section id="s-result" class="screen" hidden></section>
</div>

<div id="overlay" hidden></div>
<div id="toasts" aria-live="polite"></div>
<input id="kbd" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="键盘输入">

<script type="module" src="js/game.js"></script>
</body>
</html>
